title: "Roxana Stancu | Desarrolladora de software"
email: "ioanaroxana.st@gmail.com"
author: "Roxana Stancu"
description: >-
  Portfolio y blog técnico de Roxana Stancu sobre backend, automatización,
  sistemas, Linux, redes y desarrollo de software.
baseurl: "/website"
url: "https://esettes.github.io"
repository: "esettes/website"
lang: es
timezone: Europe/Madrid
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: "<!--more-->"
plugins:
  - jekyll-feed
feed:
  path: feed.xml
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
