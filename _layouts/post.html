---
layout: default
---
<article class="shell article-layout">
  <a href="{{ '/blog/' | relative_url }}">← Back to blog</a>
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    <p class="article-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time>
      {% if page.author %}
        <span> · {{ page.author }}</span>
      {% endif %}
    </p>
  </header>
  <section class="rich-text article-body">
    {{ content }}
  </section>
</article>
