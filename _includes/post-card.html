<article class="post-entry">
  {% if include.post.cover %}
    <a class="post-media" href="{{ include.post.url | relative_url }}">
      <img src="{{ include.post.cover | relative_url }}" alt="Cover image for {{ include.post.title }}">
    </a>
  {% else %}
    <div class="post-media media-placeholder" aria-hidden="true"></div>
  {% endif %}
  <div class="post-summary">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%d/%m/%Y" }}</time>
    <h2>
      <a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
    </h2>
    <p>{{ include.post.excerpt | default: include.post.content | strip_html | strip_newlines | truncate: 180 }}</p>
    <a href="{{ include.post.url | relative_url }}">Read article</a>
  </div>
</article>
